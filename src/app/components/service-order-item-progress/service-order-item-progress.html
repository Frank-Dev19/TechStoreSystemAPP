@if (order?.itemProgress) {
  <div
    class="item-progress"
    [class.item-progress--compact]="compact"
    [class.item-progress--partial]="delivered > 0 && delivered < total"
    [class.item-progress--complete]="total > 0 && delivered === total"
    role="group"
    [attr.aria-label]="heading + ': ' + label"
  >
    <div class="item-progress__copy">
      <span class="item-progress__heading">{{ heading }}</span>
      <strong>{{ label }}</strong>
      @if (!compact) {
        <small>{{ detail }}</small>
      }
    </div>
    <div class="item-progress__track" aria-hidden="true">
      <span [style.width.%]="percentage"></span>
    </div>
  </div>
}
