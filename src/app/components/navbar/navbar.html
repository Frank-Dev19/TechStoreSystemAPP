<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container-fluid">
        <div class="navbar-left">
            <!-- Hamburguesa: SOLO móvil -->
            <button class="hamburger only-mobile" type="button" (click)="sidebarToggle()"
                aria-label="Abrir menú lateral">
                <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" />
                </svg>
            </button>

            <a class="navbar-brand" routerLink="/">{{ getTitle() }}</a>
        </div>

        <div class="navbar-right">
            <!-- Botón de usuario (abre dropdown) -->
            <button class="user-toggle" type="button" (click)="toggleUserDropdown()" aria-haspopup="true"
                [attr.aria-expanded]="isDropdownOpen" aria-label="Abrir menú de usuario">
                <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor"
                        d="M12 12a5 5 0 1 0-5-5a5 5 0 0 0 5 5m0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5" />
                </svg>
                <span class="user-name">{{ authenticatedUser?.username }}</span>
            </button>

            <div class="dropdown-menu dropdown-menu-right" *ngIf="isDropdownOpen">
                <div class="dropdown-header">
                    <div class="user-profile">
                        <img alt="User Profile" class="avatar" src="assets/img/user.png" />
                        <h5 class="user-name">{{ authenticatedUser?.username }}</h5>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" (click)="logout()">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </div>
</nav>
