<div class="rp-wrapper" *ngIf="state==='verifying'">
    <p>Verificando enlace…</p>
</div>

<div class="rp-wrapper invalid" *ngIf="state==='invalid'">
    <h2>Enlace inválido o expirado</h2>
    <a routerLink="/forgot-password">Solicitar uno nuevo</a>
</div>

<div class="rp-wrapper" *ngIf="state==='form'">
    <h2>Restablecer contraseña</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <label>Nueva contraseña</label>
        <input type="password" formControlName="newPassword" placeholder="Mínimo 6 caracteres" />

        <label>Confirmar contraseña</label>
        <input type="password" formControlName="confirm" placeholder="Repite tu contraseña" />
        <div *ngIf="form.get('confirm')?.hasError('mismatch') && form.get('confirm')?.touched" class="err">
            Las contraseñas no coinciden.
        </div>

        <button type="submit" [disabled]="form.invalid">Cambiar contraseña</button>
    </form>
</div>

<div class="rp-wrapper done" *ngIf="state==='done'">
    <h2>¡Listo!</h2>
    <p>Tu contraseña fue actualizada.</p>
    <button (click)="goLogin()">Ir al login</button>
</div>
