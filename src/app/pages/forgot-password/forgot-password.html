<div class="fp-wrapper">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Ingresa tu correo y te enviaremos instrucciones.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" />
        <button type="submit" [disabled]="form.invalid">Enviar instrucciones</button>
    </form>

    <p *ngIf="sent" class="hint">
        Si el correo existe, se enviaron instrucciones para restablecer tu contraseña.
    </p>
</div>
